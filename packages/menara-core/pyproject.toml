[project]
name = "menara-core"
version = "0.1.0"
description = "Shared library for the Menara MCP servers: response envelope, IDs, privacy, scenario clock, audit, policy tokens, seeded synthetic data."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "PyYAML>=6.0",
]

[project.scripts]
menara-seed = "menara_core.seed.cli:main"
menara-scenario = "menara_core.scenario_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menara_core"]
