[project]
name = "menara-agent"
version = "0.1.0"
description = "A small DeepSeek-driven test driver for the Menara MCP servers (synthetic data only)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menara_agent"]

[tool.uv.sources]
menara-core = { workspace = true }