# Policy defaults (all editable). Peak hours use the local time of the scenario.
policy:
  auto_allow_max_subscribers: 500
  auto_allow_min_confidence: 0.9
  peak_start_hour: 18
  peak_end_hour: 23
  max_actions_per_hour: 10
  token_ttl_s: 300

# RAN sandbox. A scripted failure makes the first tilt on KKRI-0143 barely work, so the agent has to
# verify, roll back, and try the next option. efficacy 1.0 = the predicted effect of the model.
ran:
  scripted_failures:
    - {action: ran_tilt_cells, tower: KKRI-0143, attempt: 1, efficacy: 0.1}

# Drones are simulated. Findings are canned (no real vision model).
drone:
  speed_kmh: 90
  inspect_min: 15
  depots:
    - {id: DEP-KTBH, name: "Kota Bharu depot (synthetic)",     lat: 6.1254, lng: 102.2381, drones: [DRN-01, DRN-02]}
    - {id: DEP-KULP, name: "Kuala Lumpur depot (synthetic)",   lat: 3.1390, lng: 101.6869, drones: [DRN-03, DRN-04]}
    - {id: DEP-JBHR, name: "Johor Bahru depot (synthetic)",    lat: 1.4927, lng: 103.7414, drones: [DRN-05, DRN-06]}
    - {id: DEP-KUAN, name: "Kuantan depot (synthetic)",        lat: 3.8077, lng: 103.3260, drones: [DRN-07, DRN-08]}
    - {id: DEP-KCHG, name: "Kuching depot (synthetic)",        lat: 1.5535, lng: 110.3593, drones: [DRN-09, DRN-10]}
    - {id: DEP-KKIN, name: "Kota Kinabalu depot (synthetic)",  lat: 5.9804, lng: 116.0735, drones: [DRN-11, DRN-12]}
  findings:
    KKRI-0142:
      access_road: {status: FLOODED, water_depth_m: 0.6, passable_by: BOAT}
      tower_structure: INTACT
      antenna_alignment: ALIGNED
      power_cabinet: WATER_DAMAGE_RISK
      genset: {status: UNREACHABLE_BY_ROAD, access: BOAT}
      hazards: ["Fast-flowing water at the site entrance"]
      summary: "Access road under 0.6 m of water, tower intact, genset unreachable by road."
      confidence: 0.91
