name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m ruff check .
      - run: uv run python -m mypy
      - run: uv run python -m pytest -q
      - run: uv run python scripts/check_skill_parity.py
