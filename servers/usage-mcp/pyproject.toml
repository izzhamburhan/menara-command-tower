[project]
name = "usage-mcp"
version = "0.1.0"
description = "MCP server: What people use on the internet, by area and tower (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
usage-mcp = "usage_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
