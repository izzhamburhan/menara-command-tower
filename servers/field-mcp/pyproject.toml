[project]
name = "field-mcp"
version = "0.1.0"
description = "MCP server: Which technician to send, road or boat, parts and safety, and dispatching them (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
field-mcp = "field_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }