[project]
name = "weather-mcp"
version = "0.1.0"
description = "MCP server: Rainfall and lightning near a location (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
