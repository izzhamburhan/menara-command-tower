[project]
name = "ran-mcp"
version = "0.1.0"
description = "MCP server: Sandboxed RAN changes (tilt, cell reset, rollback) that need a signed policy token (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
ran-mcp = "ran_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ran_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
