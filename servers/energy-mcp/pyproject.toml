[project]
name = "energy-mcp"
version = "0.1.0"
description = "MCP server: Tower power draw, battery and generator time, and night-time sleep savings (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
energy-mcp = "energy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
