[project]
name = "ticket-mcp"
version = "0.1.0"
description = "MCP server: UniFi Mobile tickets, location clustering and notes (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
ticket-mcp = "ticket_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
