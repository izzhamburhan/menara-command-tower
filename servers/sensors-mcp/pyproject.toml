[project]
name = "sensors-mcp"
version = "0.1.0"
description = "MCP server: Smart-city sensors and early-warning alerts (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
sensors-mcp = "sensors_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensors_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
