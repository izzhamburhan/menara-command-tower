[project]
name = "tower-mcp"
version = "0.1.0"
description = "MCP server: cell tower status, KPIs, alarms and neighbours (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
    "httpx>=0.28",
]

[project.scripts]
tower-mcp = "tower_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
