[project]
name = "policy-mcp"
version = "0.1.0"
description = "MCP server: Policy engine: allow, ask or deny for real-world actions, approvals, signed tokens, kill switch and audit log (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
policy-mcp = "policy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
