[project]
name = "events-mcp"
version = "0.1.0"
description = "MCP server: Crowd events ahead and the load they put on nearby towers (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
events-mcp = "events_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }