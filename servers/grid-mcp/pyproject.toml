[project]
name = "grid-mcp"
version = "0.1.0"
description = "MCP server: Power feeder status and outages for tower sites (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
grid-mcp = "grid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }
