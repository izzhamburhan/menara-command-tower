[project]
name = "sites-mcp"
version = "0.1.0"
description = "MCP server: Critical sites (clinics, police, schools, SLA customers) and the towers that serve them (synthetic data)."
requires-python = ">=3.13"
dependencies = [
    "menara-core",
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
sites-mcp = "sites_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sites_mcp"]

[tool.uv.sources]
menara-core = { workspace = true }